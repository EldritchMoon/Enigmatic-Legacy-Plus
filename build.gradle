//file:noinspection GroovyAssignabilityCheck
plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    maven {
        name = "Illusive Soulworks maven"
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    validateAccessTransformers = true

    runs {
        client {
            client()

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // 26.1.2-port: only the hard dependencies + JEI API are kept for now.
    // The original's dev/test mods and optional integrations (AppleSkin, Thirst, Mystical Agriculture,
    // Apotheosis, Sophisticated Backpacks, Jade...) come back in phase 9 once they exist on 26.1.2.
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
    runtimeOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    // 26.1.2-port: Patchouli's 26.1 build is only published on Modrinth's maven
    implementation "maven.modrinth:patchouli:26.1-94-beta"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '100000'] // 26.1.2-port: show every error, not just the first 100
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// TODO(port): optional-mod integrations disabled until their mods are on 26.1.2 (phase 9)
sourceSets.main.java {
        exclude 'auviotre/enigmatic/legacy/compat/appleskin/**'
        exclude 'auviotre/enigmatic/legacy/compat/mysticalagriculture/**'
        exclude 'auviotre/enigmatic/legacy/compat/thirst/**'
        // these five are also taken out of enigmaticlegacyplus.mixins.json; put both back together
        exclude 'auviotre/enigmatic/legacy/mixin/compat/**'
        // TODO(port): the Abyssal Heart "darken" screen effect is parked (phase 7). It built its own PostChain and set
        // shader uniforms every frame through EffectInstance; that class is gone, post effects are loaded by id from
        // assets/<namespace>/post_effect/ through the ShaderManager, and their uniforms are fixed when they load. It
        // needs a redesign together with a rewrite of shaders/post/darken.json. These three are also taken out of
        // enigmaticlegacyplus.mixins.json; put both back together.
        exclude 'auviotre/enigmatic/legacy/mixin/client/MixinGameRenderer.java'
        exclude 'auviotre/enigmatic/legacy/mixin/accessor/EffectInstanceAccessor.java'
        exclude 'auviotre/enigmatic/legacy/mixin/accessor/PostChainAccessor.java'
        // TODO(port): data generators parked until phase 9; their JSON output is already in src/generated
        exclude 'auviotre/enigmatic/legacy/data/**'
}
